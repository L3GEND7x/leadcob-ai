<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LeadCob AI | Área comercial</title><link rel="stylesheet" href="/static/commercial.css"><script src="/static/commercial.js" defer></script></head>
<body><header><strong>LeadCob<span> AI</span></strong><span id="identity">Área comercial privada</span></header>
<main><section id="login" class="panel login"><p class="eyebrow">ACESSO SEGURO</p><h1>Entre no seu espaço de trabalho</h1><p>Use o código da organização fornecido pelo administrador.</p><form id="login-form"><label>Organização<input name="organization_id" type="number" min="1" required></label><label>E-mail<input name="email" type="email" maxlength="254" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<section id="workspace" hidden><div class="toolbar"><div><p class="eyebrow">WORKSPACE</p><h1>Central comercial</h1></div><button id="logout" class="secondary">Sair</button></div><nav aria-label="Módulos" id="nav"><button data-module="leads">CRM</button><button data-module="tasks">Agenda</button><button data-module="portfolios">Carteiras</button><button data-module="contacts">Contatos</button><button data-module="settings">Configurações</button><button data-module="assistant">Inteligência da organização</button><button data-module="subscription">Meu plano</button></nav><section class="panel" id="module"><h2 id="module-title"></h2><div id="form-area"></div><div id="results"></div><div class="toolbar" id="pagination" hidden><button id="prev" class="secondary">Anterior</button><span id="page"></span><button id="next" class="secondary">Próxima</button></div></section></section>
<p id="notice" role="status" aria-live="polite"></p></main></body></html>
