name: Testes

on:
  push:
    branches: [main, chatgpt/preflight-contact-verification-208]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q tests


  financial-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadcob_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: leadcob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadcob_test -d leadcob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LEADCOB_TEST_POSTGRES_URL: postgresql+psycopg://leadcob_test:local_ci_only@127.0.0.1:5432/leadcob_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_financial_integration.py

      - name: Benchmark 53k synthetic CNPJs
        timeout-minutes: 10
        run: PYTHONPATH=. python benchmarks/registry_load.py > /tmp/registry-benchmark.json
      - name: Publish benchmark results
        if: always()
        run: |
          if test -s /tmp/registry-benchmark.json; then
            cat /tmp/registry-benchmark.json
            echo '### Synthetic registry benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/registry-benchmark.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-benchmark
          path: /tmp/registry-benchmark.json
          if-no-files-found: warn

      - name: PostgreSQL logical backup and restore drill
        timeout-minutes: 5
        run: |
          # Use the same major version as the dedicated service, without apt packages.
          # Only synthetic test credentials and archives enter the temporary container.
          tools_dir="$(mktemp -d)"
          for tool in pg_dump pg_restore; do
            cat > "$tools_dir/$tool" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --network host \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGCONNECT_TIMEOUT \
            -v /tmp:/tmp postgres:16 "$(basename "$0")" "$@"
          SH
            chmod 700 "$tools_dir/$tool"
          done
          export PATH="$tools_dir:$PATH"
          pg_dump --version
          pg_restore --version
          PYTHONPATH=. python benchmarks/restore_drill.py > /tmp/restore-drill.json
      - name: Publish restore verification report
        if: always()
        run: |
          if test -s /tmp/restore-drill.json; then
            cat /tmp/restore-drill.json
            echo '### Synthetic PostgreSQL restore drill' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/restore-drill.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restore-drill-report
          path: /tmp/restore-drill.json
          if-no-files-found: warn
