name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest -q


  financial-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leadcob_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: leadcob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leadcob_test -d leadcob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      LEADCOB_TEST_POSTGRES_URL: postgresql+psycopg://leadcob_test:local_ci_only@127.0.0.1:5432/leadcob_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_financial_integration.py
