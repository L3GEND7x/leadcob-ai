# VPS with a DNS A/AAAA record pointing to the server and ports 80/443 reachable.
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DB_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadcob
      POSTGRES_DB: leadcob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - leadcob_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadcob -d leadcob"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: leadcob
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: leadcob
    volumes:
      - ./backups:/backups
      - ./infra/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  leadcob_pg:
  caddy_data:
  caddy_config:
